<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#E8DCC4" opacity=".12"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F3D2B"/>
      <stop offset="1" stop-color="#16301F"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="440" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="28" fill="url(#dots)"/>
  <g fill="none" stroke="#E8DCC4" stroke-opacity=".10" stroke-width="1.5">
    <circle cx="1130" cy="60" r="120"/><circle cx="1130" cy="60" r="190"/><circle cx="1130" cy="60" r="260"/>
  </g>

  <!-- logo -->
  <rect x="72" y="70" width="56" height="56" rx="14" fill="#E8DCC4"/>
  <path d="M100 86 L118 95 L100 104 L82 95 Z" fill="#1F3D2B"/>
  <path d="M89 99 v8 c0 4 22 4 22 0 v-8" fill="none" stroke="#1F3D2B" stroke-width="3" stroke-linecap="round"/>
  <text x="146" y="108" font-size="30" fill="#F7F6F0">GeezeStudy</text>

  <text x="72" y="210" font-size="54" fill="#F7F6F0">Tugas, jadwal, dan target</text>
  <text x="72" y="272" font-size="54" fill="#F7F6F0">belajar di satu tempat <tspan fill="#E8DCC4" font-style="italic">tenang.</tspan></text>
  <text x="72" y="326" font-size="21" fill="#DCE5D9" font-family="Segoe UI, Helvetica, Arial, sans-serif">Platform produktivitas akademik untuk SD, SMP, SMA, dan mahasiswa.</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="72" y="358" width="92" height="34" rx="17" fill="#E8DCC4" fill-opacity=".14"/><text x="118" y="380" text-anchor="middle" fill="#E8DCC4">Points</text>
    <rect x="174" y="358" width="84" height="34" rx="17" fill="#E8DCC4" fill-opacity=".14"/><text x="216" y="380" text-anchor="middle" fill="#E8DCC4">Level</text>
    <rect x="268" y="358" width="92" height="34" rx="17" fill="#E8DCC4" fill-opacity=".14"/><text x="314" y="380" text-anchor="middle" fill="#E8DCC4">Streak</text>
    <rect x="370" y="358" width="100" height="34" rx="17" fill="#E8DCC4" fill-opacity=".14"/><text x="420" y="380" text-anchor="middle" fill="#E8DCC4">Missions</text>
    <rect x="480" y="358" width="134" height="34" rx="17" fill="#E8DCC4" fill-opacity=".14"/><text x="547" y="380" text-anchor="middle" fill="#E8DCC4">Achievements</text>
  </g>

  <!-- mini app card -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="852" y="130" width="356" height="236" rx="20" fill="#FDFDFA"/>
    <text x="878" y="168" font-size="16" font-weight="600" fill="#20241F">Hari ini</text>
    <rect x="1110" y="150" width="74" height="26" rx="13" fill="#E8DCC4"/>
    <text x="1147" y="168" font-size="13" font-weight="600" text-anchor="middle" fill="#20241F">🔥 9 hari</text>
    <circle cx="887" cy="203" r="9" fill="#1F3D2B"/>
    <path d="M883 203 l3 3 l5 -6" fill="none" stroke="#F7F6F0" stroke-width="2" stroke-linecap="round"/>
    <text x="906" y="208" font-size="14" fill="#858980" text-decoration="line-through">Laporan praktikum fotosintesis</text>
    <circle cx="887" cy="237" r="8.5" fill="none" stroke="#D4D1C5" stroke-width="1.5"/>
    <text x="906" y="242" font-size="14" fill="#20241F">Latihan 30 soal integral</text>
    <text x="1184" y="242" font-size="12" text-anchor="end" fill="#555A52">Besok</text>
    <circle cx="887" cy="271" r="8.5" fill="none" stroke="#D4D1C5" stroke-width="1.5"/>
    <text x="906" y="276" font-size="14" fill="#20241F">Tryout UTBK online #4</text>
    <text x="1184" y="276" font-size="12" text-anchor="end" fill="#555A52">Senin</text>
    <rect x="878" y="298" width="306" height="48" rx="12" fill="#DCE5D9"/>
    <text x="896" y="318" font-size="12" font-weight="600" fill="#20241F">Target belajar</text>
    <text x="1170" y="318" font-size="12" text-anchor="end" fill="#555A52">59/90 menit</text>
    <rect x="896" y="328" width="274" height="6" rx="3" fill="#FDFDFA"/>
    <rect x="896" y="328" width="181" height="6" rx="3" fill="#1F3D2B"/>
  </g>
